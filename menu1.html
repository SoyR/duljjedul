<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>연말 선물 랜덤뽑기 | Doridul Christmas Party</title>
    <link rel="icon" href="tree.ico" type="image/x-icon">
    <meta property="og:title" content="연말 선물 랜덤뽑기 | Doridul Christmas Party">
    <meta property="og:description" content="선물 뽑기를 시작합니다. 서로의 산타가 되어줄 순서를 정해볼까요?">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://soyr.github.io/doridul/menu1.html">
    <meta property="og:image" content="https://soyr.github.io/doridul/doridulillust.png">
    <meta property="og:image:width" content="1024">
    <meta property="og:image:height" content="716">
    <meta property="og:image:type" content="image/png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="연말 선물 랜덤뽑기 | Doridul Christmas Party">
    <meta name="twitter:image" content="https://soyr.github.io/doridul/doridulillust.png">
    <!-- 클래식 폰트 불러오기 (Great Vibes, Playfair Display, Gowun Batang) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Great+Vibes&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="menu1.css">
</head>
<body>

<div class="card">
    <div class="corner-decoration top-left">✦</div>
    <div class="corner-decoration top-right">✦</div>
    <div class="corner-decoration bottom-left">✦</div>
    <div class="corner-decoration bottom-right">✦</div>

    <a href="index.html" class="back-link">← 메인으로</a>

    <!-- 탭 -->
    <div class="tab-list" role="tablist">
        <button class="tab-btn" id="tab-color" role="tab" aria-controls="panel-color" onclick="switchTab('color')">컬러뽑기</button>
        <button class="tab-btn" id="tab-gift" role="tab" aria-controls="panel-gift" onclick="switchTab('gift')">선물뽑기</button>
    </div>

    <!-- 컬러뽑기 -->
    <div id="panel-color" role="tabpanel" aria-labelledby="tab-color">
        <div class="lotto-turn hidden" id="lotto-turn">
            <p class="lotto-turn-label" id="lotto-turn-label" aria-live="polite">이번에 뽑을 사람은!</p>
            <div class="members-list lotto-members" id="lotto-members"></div>
        </div>

        <div class="lotto-machine">
            <div class="lotto-globe" id="lotto-globe">
                <span class="lotto-drum-text" id="lotto-drum-text" aria-hidden="true">두구두구두구</span>
                <div class="lotto-start-panel" id="lotto-start-panel">
                    <div class="lotto-start-row">
                        <select id="lotto-count" class="lotto-count-select" aria-label="인원수" onchange="previewCountBalls()">
                        <option value="doridul">둘째덜</option>
                        <option value="2">2명</option>
                        <option value="3">3명</option>
                        <option value="4" selected>4명</option>
                        <option value="5">5명</option>
                        <option value="6">6명</option>
                        <option value="7">7명</option>
                        <option value="8">8명</option>
                        <option value="9">9명</option>
                        <option value="10">10명</option>
                        </select>
                        <button class="lotto-start-btn" onclick="startLotto()">시작</button>
                    </div>
                </div>
            </div>
            <div class="lotto-chute"></div>
        </div>

        <div class="lotto-tray" aria-live="polite">
            <span id="lotto-label" style="font-size: 0.95rem;">시작 버튼을 눌러주세요</span>
            <div class="lotto-result" id="lotto-result"></div>
        </div>

        <button class="btn hidden" id="lotto-btn" onclick="drawColor()">컬러 뽑기</button>
        <button class="lotto-restart hidden" id="lotto-restart" onclick="restartLotto()">다시하기</button>

        <div class="lotto-history" id="lotto-history"></div>
    </div>

    <!-- 선물뽑기 -->
    <div id="panel-gift" role="tabpanel" aria-labelledby="tab-gift" class="hidden">

    <!-- 1. 메인 화면 -->
    <div id="step-1">
        <img src="gift-illust.png" alt="Doridul illustration" class="main-illust">
        <p class="description">
            선물 뽑기를 시작합니다.<br>
            인원수를 선택하고 이름을 입력해주세요.
        </p>

        <div class="setup-row">
            <label for="member-count">인원수</label>
            <select id="member-count" class="select-input" onchange="renderNameInputs(this.value)">
                <option value="doridul">둘째덜</option>
                <option value="3">3명</option>
                <option value="4" selected>4명</option>
                <option value="5">5명</option>
                <option value="6">6명</option>
                <option value="7">7명</option>
                <option value="8">8명</option>
                <option value="9">9명</option>
                <option value="10">10명</option>
            </select>
        </div>

        <div class="name-inputs" id="name-inputs"></div>

        <div class="setup-row doridul-code-row hidden" id="doridul-code-row">
            <label for="doridul-code">코드</label>
            <input type="password" id="doridul-code" class="name-input doridul-code-input" inputmode="numeric" pattern="[0-9]*" maxlength="12" autocomplete="off" placeholder="숫자 코드 입력">
        </div>

        <p class="setup-error hidden" id="setup-error"></p>

        <button class="btn" onclick="handleSetupStart()">시작</button>
    </div>

    <!-- 2~7. 진행 화면 (공통 레이아웃 사용) -->
    <div id="step-game" class="hidden">
        <h2 class="classic-title" id="game-title">Christmas Party</h2>

        <p class="description" id="game-desc"></p>

        <div class="members-list" id="members-container"></div>

        <div class="lotto-machine">
            <div class="lotto-globe" id="gift-globe">
                <span class="lotto-drum-text" id="gift-drum-text" aria-hidden="true">두구두구두구</span>
            </div>
            <div class="lotto-chute"></div>
        </div>

        <div class="result-box">
            <span id="result-label" style="font-size: 0.95rem;">버튼을 눌러 사람을 뽑아주세요</span>
            <div id="result-name" class="highlight-name"></div>
        </div>

        <div id="chain-history" class="chain-history hidden"></div>

        <button class="btn" id="action-btn" onclick="drawFirstWithLoading()">첫번째 사람 뽑기</button>
    </div>

    </div><!-- /panel-gift -->

</div>

<script src="script.js"></script>
<script src="menu1.js"></script>

</body>
</html>
