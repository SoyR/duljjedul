<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>선물게임 | Doridul Christmas Party</title>
    <link rel="icon" href="tree.ico" type="image/x-icon">
    <meta property="og:title" content="선물게임 | Doridul Christmas Party">
    <meta property="og:description" content="블록을 피하고 선물을 모으는 점프 게임을 즐겨보세요.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://soyr.github.io/doridul/menu2.html">
    <meta property="og:image" content="https://soyr.github.io/doridul/doridulillust.png">
    <meta property="og:image:width" content="1024">
    <meta property="og:image:height" content="716">
    <meta property="og:image:type" content="image/png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="선물게임 | Doridul Christmas Party">
    <meta name="twitter:image" content="https://soyr.github.io/doridul/doridulillust.png">
    <!-- 클래식 폰트 불러오기 (Great Vibes, Playfair Display, Gowun Batang) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Great+Vibes&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card">
    <div class="corner-decoration top-left">✦</div>
    <div class="corner-decoration top-right">✦</div>
    <div class="corner-decoration bottom-left">✦</div>
    <div class="corner-decoration bottom-right">✦</div>

    <a href="index.html" class="back-link">← 메인으로</a>

    <!-- 1. 시작 화면 -->
    <div id="step-start">
        <h1 class="script-title">Doridul</h1>
        <h2 class="classic-title">Christmas Party</h2>
        <img src="game_character_4.png" alt="Doridul illustration" class="main-illust game-start-illust">
        <p class="description">
            블록을 점프로 피하고<br>
            선물을 모아 점수를 획득하세요!
        </p>
        <div class="btn-row">
            <button class="btn" id="start-btn">START</button>
            <button class="btn" id="ranking-btn">랭킹보기</button>
        </div>
    </div>

    <!-- 2. 게임 화면 -->
    <div id="step-game" class="hidden">
        <h2 class="classic-title">선물게임</h2>
        <div class="score-board">Score: <span id="score">0</span></div>

        <div class="game-frame" id="game-frame">
            <div class="ground-line"></div>
            <img id="character" src="game_character_1.png" class="character" alt="character">
        </div>

        <button class="jump-btn" id="jump-btn">Jump!</button>
    </div>

    <!-- 3. 게임 오버 화면 -->
    <div id="step-gameover" class="hidden">
        <h2 class="classic-title">Game Over</h2>
        <p class="description">최종 점수: <span id="final-score">0</span>점</p>

        <div class="name-entry" id="name-entry">
            <input type="text" id="name-input" class="name-input" maxlength="8" placeholder="이름을 입력하세요">
            <button class="btn" id="submit-score-btn">저장</button>
        </div>

        <div class="leaderboard" id="leaderboard"></div>

        <button class="btn" id="retry-btn">다시하기</button>
    </div>

    <!-- 4. 랭킹 화면 -->
    <div id="step-ranking" class="hidden">
        <h2 class="classic-title">랭킹</h2>

        <div class="leaderboard" id="ranking-list"></div>

        <button class="btn" id="ranking-back-btn">돌아가기</button>
    </div>

</div>

<script src="game.js"></script>

</body>
</html>
